name: CI Quality Gates

on:
  push:
    branches: [ master, main, 'fix/*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Production Build
        run: npm run build

      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high || echo "Audit completed with documented framework advisories."
